name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Commits pushed by the stats workflow (with GITHUB_TOKEN) do not trigger "push" workflows,
  # so deploy after every stats run as well.
  workflow_run:
    workflows: ["Update download stats"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - name: Check search contracts
        run: node --test search/tests/*.test.mjs
      - uses: actions/cache@v6
        with:
          path: .hf-cache
          key: search-text-q8-daa72c51243991dfcaf9f9137d2c573d8f7790c0-transformers-4.3.1-${{ runner.os }}
      - name: Build site and text search index
        env:
          HF_CACHE_DIR: ${{ github.workspace }}/.hf-cache
        run: npm run build
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
