name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Commits pushed by the stats workflow (with GITHUB_TOKEN) do not trigger "push" workflows,
  # so deploy after every stats run as well.
  workflow_run:
    workflows: ["Update download stats"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - name: Collect site files
        run: |
          mkdir _site
          cp -R index.html links.json stats.json assets _site/
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
