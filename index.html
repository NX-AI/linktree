<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NXAI — Publications &amp; Resources</title>
<meta name="description" content="xLSTM, TiRex, Vision-LSTM, Bio-xLSTM and LRAM: papers, code and live demos from NXAI.">

<meta property="og:title" content="NXAI — Publications & Resources">
<meta property="og:description" content="Papers, code and live demos for xLSTM, TiRex, Vision-LSTM, Bio-xLSTM and LRAM.">
<meta property="og:type" content="website">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hind:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
  :root{
    --bg:#111111;
    --card:#1A1A1A;
    --teal:#5BFFE6;
    --white:#FFFFFF;
    --offwhite:#F5F5F5;
    --grey:#888888;
    --border:#2A2A2A;
    --hover:#212121;
    --icon-github:#FFFFFF;
    --icon-hf:#FFD21E;
    --icon-arxiv:#B31B1B;
    --icon-docker:#2496ED;
    --icon-jupyter:#F37626;
  }

  /* Light theme: teal must darken for contrast on white, per brand alt palette (#0B8A78 / #00766B) */
  [data-theme="light"]{
    --bg:#FAFAF8;
    --card:#FFFFFF;
    --teal:#00766B;
    --white:#141414;
    --offwhite:#2B2B2B;
    --grey:#6B6B6B;
    --border:#E4E4E0;
    --hover:#F1F1EE;
    --icon-github:#181717;
  }

  *{ box-sizing:border-box; }

  html,body{
    margin:0;
    padding:0;
    background:var(--bg);
    color:var(--white);
    font-family:'Hind', system-ui, sans-serif;
    transition: background .2s ease, color .2s ease;
  }

  body{
    min-height:100vh;
    padding: 64px 24px 80px;
  }

  .wrap{
    max-width: 1000px;
    margin: 0 auto;
  }

  header{
    margin-bottom: 48px;
    display:flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 24px;
  }

  .eyebrow{
    display:inline-block;
    font-size: 11px;
    font-weight:600;
    letter-spacing: 0.14em;
    text-transform:uppercase;
    color: var(--teal);
    border: 1px solid var(--teal);
    padding: 5px 10px;
    border-radius: 3px;
    margin-bottom: 20px;
  }

  h1{
    font-size: clamp(30px, 5vw, 46px);
    font-weight:700;
    line-height:1.15;
    margin: 0 0 14px;
    color: var(--white);
  }

  header p.sub{
    font-size: 16px;
    color: var(--offwhite);
    max-width: 600px;
    line-height:1.5;
    margin:0;
  }

  .theme-toggle{
    flex-shrink:0;
    display:flex;
    align-items:center;
    gap:6px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 4px;
    margin-top: 2px;
  }

  .theme-toggle button{
    font-family:inherit;
    font-size: 12px;
    font-weight:600;
    letter-spacing: 0.02em;
    color: var(--grey);
    background: transparent;
    border: none;
    padding: 7px 13px;
    border-radius: 16px;
    cursor:pointer;
    display:flex;
    align-items:center;
    gap:6px;
    transition: background .15s ease, color .15s ease;
  }

  .theme-toggle button.active{
    background: var(--teal);
    color: var(--bg);
  }

  .theme-toggle svg{ width:14px; height:14px; }

  nav.tabs{
    display:flex;
    gap:8px;
    margin: 8px 0 8px;
    flex-wrap: wrap;
  }

  .tab{
    font-family:inherit;
    font-size: 13px;
    font-weight:600;
    letter-spacing: 0.03em;
    color: var(--grey);
    background: transparent;
    border: 1px solid var(--border);
    padding: 8px 16px;
    border-radius: 3px;
    cursor:pointer;
    transition: color .15s ease, border-color .15s ease;
  }

  .tab:hover{ color: var(--white); border-color:#666; }

  .tab.active{
    color: var(--bg);
    background: var(--teal);
    border-color: var(--teal);
  }

  section.group{
    margin-top: 44px;
  }

  .model-label{
    font-size: 15px;
    font-weight:700;
    color: var(--white);
    margin-bottom: 4px;
  }

  .subgroup-label{
    font-size: 11px;
    font-weight:600;
    letter-spacing: 0.14em;
    text-transform:uppercase;
    color: var(--teal);
    margin: 22px 0 12px;
  }

  .grid{
    display:grid;
    grid-template-columns: 1fr;
    gap: 10px;
  }

  a.entry, div.entry{
    display:flex;
    align-items:center;
    gap: 16px;
    background: var(--card);
    border: 1px solid var(--border);
    border-left: 2px solid var(--teal);
    border-radius: 3px;
    padding: 14px 18px;
    text-decoration:none;
    color:inherit;
    transition: background .15s ease, transform .1s ease;
  }

  a.entry:hover{
    background: var(--hover);
    transform: translateX(2px);
  }

  .entry-icon{
    flex-shrink:0;
    width: 34px;
    height: 34px;
    border-radius: 3px;
    background: var(--bg);
    display:flex;
    align-items:center;
    justify-content:center;
    color: var(--teal);
  }

  .entry-icon svg{ width:17px; height:17px; }

  .entry-main{
    min-width:0;
    flex:1;
  }

  .entry-title{
    font-size: 14.5px;
    font-weight:600;
    color: var(--white);
    margin-bottom: 3px;
    line-height:1.3;
  }

  .entry-meta{
    font-size: 12px;
    color: var(--grey);
    white-space: nowrap;
    overflow:hidden;
    text-overflow: ellipsis;
  }

  .entry-tag{
    flex-shrink:0;
    font-size: 10.5px;
    font-weight:600;
    letter-spacing: 0.06em;
    text-transform:uppercase;
    color: var(--teal);
    border: 1px solid var(--teal);
    padding: 4px 9px;
    border-radius: 3px;
    white-space:nowrap;
  }

  a.entry-tag-link{
    flex-shrink:0;
    font-size: 10.5px;
    font-weight:600;
    letter-spacing: 0.06em;
    text-transform:uppercase;
    color: var(--teal);
    border: 1px solid var(--teal);
    padding: 4px 9px;
    border-radius: 3px;
    white-space:nowrap;
    text-decoration:none;
    transition: background .15s ease, color .15s ease;
  }

  a.entry-tag-link:hover{
    background: var(--teal);
    color: var(--bg);
  }

  .entry-links{
    flex-shrink:0;
    display:flex;
    gap:8px;
  }

  .entry-arrow{
    flex-shrink:0;
    color: var(--teal);
    font-size: 16px;
  }

  .load-error{
    font-size: 13px;
    color: var(--grey);
    border: 1px dashed var(--border);
    border-radius: 3px;
    padding: 14px 18px;
  }

  footer{
    margin-top: 72px;
    padding-top: 24px;
    border-top: 1px solid var(--border);
    font-size: 12px;
    color: var(--grey);
    display:flex;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 8px;
  }

  footer a{ color: var(--grey); }
  footer a:hover{ color: var(--teal); }

  @media (max-width: 560px){
    header{ flex-direction:column; }
  }
</style>
</head>
<body>

<div class="wrap">

  <header>
    <div>
      <div class="eyebrow">Reference index</div>
      <h1>Publications &amp; resources</h1>
      <p class="sub">Papers, code and live demos behind xLSTM, TiRex, Vision-LSTM, Bio-xLSTM and LRAM. Updated as new work lands.</p>
    </div>
    <div class="theme-toggle" id="theme-toggle">
      <button data-theme-btn="dark">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
        Dark
      </button>
      <button data-theme-btn="light">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        Light
      </button>
    </div>
  </header>

  <nav class="tabs" id="tabs"></nav>

  <div id="content"></div>

  <footer>
    <span>NXAI · nx-ai.com</span>
    <span>Last updated: <span id="last-updated">—</span></span>
  </footer>

</div>

<script>
  /* =================================================================
     THEME
     ================================================================= */
  const root = document.documentElement;
  function setTheme(theme){
    root.setAttribute("data-theme", theme);
    localStorage.setItem("nxai-links-theme", theme);
    document.querySelectorAll("[data-theme-btn]").forEach(btn=>{
      btn.classList.toggle("active", btn.dataset.themeBtn === theme);
    });
  }
  const savedTheme = localStorage.getItem("nxai-links-theme")
    || (window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark");
  setTheme(savedTheme);
  document.querySelectorAll("[data-theme-btn]").forEach(btn=>{
    btn.addEventListener("click", () => setTheme(btn.dataset.themeBtn));
  });

  };

  const MODELS = ["xLSTM", "TiRex", "Vision-LSTM", "Bio-xLSTM", "LRAM (Robotics)"];
  const MODEL_KEY = { "xLSTM":"xlstm", "TiRex":"tirex", "Vision-LSTM":"vision-lstm", "Bio-xLSTM":"bio-xlstm", "LRAM (Robotics)":"lram" };

  const tabsEl = document.getElementById("tabs");
  const contentEl = document.getElementById("content");

  function iconEl(iconKey){
    const icon = ICONS[iconKey] || ICONS.article;
    return `<div class="entry-icon" style="color:${icon.color}">${icon.svg}</div>`;
  }

  function entryEl(item){
    // Single-link entry: whole card is clickable.
    if (!item.links){
      const a = document.createElement("a");
      a.className = "entry";
      a.href = item.url;
      a.target = "_blank";
      a.rel = "noopener noreferrer";
      a.innerHTML = `
        ${iconEl(item.icon)}
        <div class="entry-main">
          <div class="entry-title">${item.title}</div>
          <div class="entry-meta">${item.meta || ""}</div>
        </div>
        <span class="entry-tag">${item.tag}</span>
        <span class="entry-arrow">→</span>
      `;
      return a;
    }
    // Multi-link entry (e.g. the same post cross-posted): card is not
    // itself a link; each platform gets its own small pill instead.
    const div = document.createElement("div");
    div.className = "entry";
    const linkPills = item.links.map(l =>
      `<a class="entry-tag-link" href="${l.url}" target="_blank" rel="noopener noreferrer">${l.tag}</a>`
    ).join("");
    div.innerHTML = `
      ${iconEl(item.icon)}
      <div class="entry-main">
        <div class="entry-title">${item.title}</div>
        <div class="entry-meta">${item.meta || ""}</div>
      </div>
      <div class="entry-links">${linkPills}</div>
    `;
    return div;
  }

  function renderModelBlock(container, links, modelKey, showLabel){
    const items = links.filter(l => l.model === modelKey);
    if (!items.length) return;

    if (showLabel){
      const label = document.createElement("div");
      label.className = "model-label";
      label.textContent = MODELS.find(m => MODEL_KEY[m] === modelKey);
      container.appendChild(label);
    }

    ["paper", "code"].forEach(type => {
      const typeItems = items.filter(i => i.type === type);
      if (!typeItems.length) return;

      const sub = document.createElement("div");
      sub.className = "subgroup-label";
      sub.textContent = type === "paper" ? "Papers" : "Code & resources";
      container.appendChild(sub);

      const grid = document.createElement("div");
      grid.className = "grid";
      typeItems.forEach(i => grid.appendChild(entryEl(i)));
      container.appendChild(grid);
    });
  }

  function renderTabs(active, onSelect){
    tabsEl.innerHTML = "";
    const all = ["All", ...MODELS];
    all.forEach(label => {
      const btn = document.createElement("button");
      btn.className = "tab" + (label === active ? " active" : "");
      btn.textContent = label;
      btn.addEventListener("click", () => onSelect(label));
      tabsEl.appendChild(btn);
    });
  }

  function render(links, active){
    renderTabs(active, (label) => render(links, label));
    contentEl.innerHTML = "";

    if (active === "All"){
      MODELS.forEach(m => {
        const section = document.createElement("section");
        section.className = "group";
        renderModelBlock(section, links, MODEL_KEY[m], true);
        if (section.children.length) contentEl.appendChild(section);
      });
    } else {
      const section = document.createElement("section");
      section.className = "group";
      renderModelBlock(section, links, MODEL_KEY[active], false);
      contentEl.appendChild(section);
    }
  }

  /* =================================================================
     LOAD DATA — edit links.json to add or update entries.
     No changes to this file are needed for routine updates.
     ================================================================= */
  fetch("links.json")
    .then(res => {
      if (!res.ok) throw new Error("links.json returned " + res.status);
      return res.json();
    })
    .then(links => {
      document.getElementById("last-updated").textContent =
        new Date().toISOString().slice(0, 10);
      render(links, "All");
    })
    .catch(err => {
      contentEl.innerHTML = `<div class="load-error">
        Could not load links.json (${err.message}). If you're opening this file
        directly from disk, browsers block local fetch() calls — serve it over
        HTTP instead, e.g. <code>python3 -m http.server</code>, or view it on
        GitHub Pages once deployed.
      </div>`;
    });
</script>

</body>
</html>
